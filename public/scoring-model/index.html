<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Trust Score — scoring model</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #2a2a2a; line-height: 1.55; }
.container { max-width: 1120px; margin: 0 auto; padding: 32px 20px 80px; }
h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 4px; }
h2 { font-size: 1.2rem; font-weight: 600; margin: 36px 0 12px; padding-bottom: 6px; border-bottom: 2px solid #ececec; }
.subtitle { color: #666; font-size: 0.92rem; margin-bottom: 20px; }
p { margin-bottom: 10px; }
a { color: #1a56db; }
.mono { font-variant-numeric: tabular-nums; }

.loading, .error { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:55vh; text-align:center; color:#666; }
.spinner { width:42px; height:42px; border:4px solid #e0e0e0; border-top-color:#1a73e8; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:14px; }
@keyframes spin { to { transform: rotate(360deg);} }

.writeup { background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:18px 22px; margin-bottom:14px; font-size:0.92rem; }
.writeup p:last-child { margin-bottom:0; }
details.writeup > summary { cursor:pointer; font-weight:600; list-style:none; margin-bottom:8px; }
details.writeup > summary::-webkit-details-marker { display:none; }
details.writeup > summary::before { content:"▸ "; color:#888; }
details.writeup[open] > summary::before { content:"▾ "; }

.controls { display:flex; flex-wrap:wrap; gap:14px 26px; align-items:flex-end; margin-bottom:14px; }
.ctl-group { display:flex; flex-direction:column; gap:5px; }
.ctl-label { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:#888; font-weight:600; }
.seg { display:flex; border:1px solid #cdd3da; border-radius:8px; overflow:hidden; width:max-content; }
.seg button { border:0; background:#fff; padding:7px 16px; font-size:0.85rem; cursor:pointer; color:#444; border-right:1px solid #e3e6ea; }
.seg button:last-child { border-right:0; }
.seg button.on { background:#1a56db; color:#fff; font-weight:600; }

.eq { background:#f6f8fb; border:1px solid #e6e6e6; border-radius:10px; padding:16px 20px; margin-bottom:16px; }
.eq .row { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:0.9rem; line-height:2.1; white-space:nowrap; overflow-x:auto; }
.eq .row b { color:#1a56db; font-weight:700; }
.eq .cons { font-size:0.85rem; color:#555; margin-top:10px; padding-top:10px; border-top:1px solid #ececec; }
.eq .cons b { color:#1a1a1a; font-variant-numeric:tabular-nums; }

.cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:4px; }
.metric { background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:14px 16px; }
.metric .k { font-size:0.74rem; text-transform:uppercase; letter-spacing:0.03em; color:#888; }
.metric .v { font-size:1.55rem; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }
.metric .b { font-size:0.76rem; color:#999; margin-top:1px; }
.metric .d { font-size:0.8rem; font-weight:600; margin-top:3px; }
.up { color:#15803d; } .down { color:#b91c1c; } .flat { color:#999; }
@media (max-width:720px){ .cards{ grid-template-columns:repeat(2,1fr);} }
.bands { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
.band { display:inline-flex; align-items:center; gap:7px; font-size:0.8rem; color:#444; border:1px solid #eaeaea; border-radius:8px; padding:5px 11px; }
.band .sw { width:11px; height:11px; border-radius:3px; flex:none; }
.band .rg { font-variant-numeric:tabular-nums; color:#888; font-size:0.74rem; }
.changed { background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:15px 18px; margin-bottom:14px; }
.changed .hd { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:#888; font-weight:600; margin-bottom:11px; }
.chgrow { display:flex; flex-wrap:wrap; gap:30px; margin-bottom:8px; }
.chstat { display:flex; flex-direction:column; }
.chstat .k { font-size:0.74rem; color:#888; }
.chstat .v { font-size:1.2rem; font-weight:700; font-variant-numeric:tabular-nums; }
.chstat .v small { font-size:0.74rem; font-weight:400; color:#999; }
.dot-band { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }

.card { background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:18px 20px; margin-bottom:14px; }
.legend { font-size:0.82rem; color:#666; margin:4px 0 0; }
.swatch { display:inline-block; width:11px; height:11px; border-radius:2px; vertical-align:middle; margin:0 3px 0 12px; }

svg { display:block; width:100%; height:auto; }
.dot { cursor:pointer; transition: cx .55s cubic-bezier(.4,0,.2,1), fill .3s; }
.lane-label { font-size:11px; fill:#666; }

.fcard { border:1px solid #e6e6e6; border-radius:10px; margin-bottom:12px; overflow:hidden; }
.fhead { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; background:#fff; }
.fhead:hover { background:#f6f8fb; }
.ftitle { flex:1; font-weight:600; font-size:0.95rem; }
.ftag { font-size:0.72rem; color:#777; background:#f0f2f5; border-radius:20px; padding:2px 9px; white-space:nowrap; }
.fscore { font-variant-numeric:tabular-nums; font-size:0.85rem; color:#555; white-space:nowrap; }
.fscore b { font-size:1.05rem; }
.fbody { padding:0 16px 14px; display:none; border-top:1px solid #eee; }
.fcard.open .fbody { display:block; }
.varbar { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
.chip { font-size:0.76rem; border:1px solid #e0e4e8; border-radius:7px; padding:4px 8px; font-variant-numeric:tabular-nums; }
.chip .cl { color:#888; } .chip.bk { border-color:#f0b3bd; background:#fff5f6; } .chip.ak { border-color:#9ec3f5; background:#eef5ff; }
.claim { border-top:1px dashed #ececec; padding:9px 0; font-size:0.85rem; }
.claim .cmeta { font-size:0.74rem; font-weight:600; margin-bottom:2px; }
.sev-major { color:#b91c1c; } .sev-minor { color:#b45309; } .sev-none { color:#15803d; }
.excerpt { color:#555; font-style:italic; border-left:3px solid #eee; padding-left:9px; margin:3px 0; }
.reason { color:#666; font-size:0.82rem; }

.search { width:100%; padding:9px 12px; border:1px solid #cdd3da; border-radius:8px; font-size:0.9rem; margin-bottom:10px; }
table.tbl { width:100%; border-collapse:collapse; font-size:0.84rem; }
table.tbl th, table.tbl td { padding:6px 9px; border-bottom:1px solid #eee; text-align:right; }
table.tbl th:first-child, table.tbl td:first-child { text-align:left; }
table.tbl th { color:#666; font-weight:600; }
table.tbl th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
table.tbl th.sortable:hover { color:#1a56db; }
table.tbl th .arrow { color:#1a56db; margin-left:3px; font-size:0.7rem; }
table.tbl tr.detail { cursor:pointer; } table.tbl tr.detail:hover { background:#f6f8fb; }
.tnum { font-variant-numeric:tabular-nums; }
.pager { display:flex; align-items:center; gap:12px; justify-content:flex-end; margin-top:12px; font-size:0.84rem; color:#555; font-variant-numeric:tabular-nums; }
.pager button { border:1px solid #cdd3da; background:#fff; border-radius:7px; padding:5px 12px; cursor:pointer; font-size:0.84rem; color:#333; }
.pager button:hover:not(:disabled) { border-color:#1a56db; color:#1a56db; }
.pager button:disabled { opacity:0.4; cursor:default; }
.tip { position:fixed; pointer-events:none; background:#1f2937; color:#fff; font-size:0.78rem; padding:6px 9px; border-radius:6px; max-width:300px; opacity:0; transition:opacity .12s; z-index:50; }
</style>
</head>
<body>
<div class="container">
  <div id="app"><div class="loading"><div class="spinner"></div><p>Loading scoring data…</p></div></div>
</div>
<div class="tip" id="tip"></div>

<script>
const FMT = n => n.toLocaleString("en-US");
const PCT = x => (x*100).toFixed(1) + "%";
const PP = d => (d>=0?"+":"") + (d*100).toFixed(1) + "pp";
const NBINS = 40;

// Fixed model: RATE points lost per weighted major-equivalent issue (major=1.0,
// minor=0.3) per 1,000 words. Normalizing by characters uses each module's
// character count with a coefficient calibrated to the same scale. Production
// (the red reference) divides by claim count and adds an absolute ln(major) penalty.
const RATE = 30, MINORW = 0.3, CLAIM_MULT = 50, PAGE_SIZE = 50;
const PCT0 = x => Math.round(x*100) + "%";
const SGN = x => (x>=0?"+":"") + x.toFixed(1);
// human-readable interpretation of the 0-100 score, by error-density band
const BANDS = [
  {lo:90, hi:100, label:"Low issue density — broadly trustworthy", c:"#15803d"},
  {lo:70, hi:90,  label:"Some issues for its length — worth a look", c:"#ca8a04"},
  {lo:40, hi:70,  label:"Elevated issue density — review", c:"#ea580c"},
  {lo:0,  hi:40,  label:"Very high issue density — likely needs rework", c:"#b91c1c"},
];
function bandOf(s){ return s===null||s===undefined ? null : (BANDS.find(b=>s>=b.lo) || BANDS[BANDS.length-1]); }
let DATA, BYID, KCAL, CHARS_COEF, STATE = { scaleBy:"words", sortCol:"active", sortDir:"asc", page:0 };

const FLOOR_T = 25;   // at/above this the score is the raw line; below it the score eases toward 0
function softFloor(raw){ return raw >= FLOOR_T ? Math.min(100, raw) : FLOOR_T*Math.exp((raw-FLOOR_T)/FLOOR_T); }
function coefOf(scaleBy){ return scaleBy==="chars" ? CHARS_COEF : RATE; }   // pts per issue per 1,000 units
function contentScore(d, scaleBy){
  const size = scaleBy==="chars" ? d.chars : d.words;
  if(!size || size<=0) return null;
  return softFloor(100 - coefOf(scaleBy)*1000*(d.major + MINORW*d.minor)/size);
}
const activeScore = d => contentScore(d, STATE.scaleBy);
function baseScore(d){          // production: claims denominator + abs penalty (fixed reference)
  if(!d.claims) return null;
  const pen = CLAIM_MULT*(d.major+MINORW*d.minor)/d.claims, abs = CLAIM_MULT*0.5*Math.log(d.major+1);
  return Math.max(0, Math.min(100, 100 - pen - abs));
}

function stats(vals){
  const v=vals.filter(x=>x!==null).sort((a,b)=>a-b); const n=v.length;
  const q=p=>v[Math.min(Math.floor(p*n),n-1)];
  return { n, mean:v.reduce((a,b)=>a+b,0)/n, median:q(.5), p25:q(.25), p5:q(.05),
           ge90:v.filter(x=>x>=90).length, flag:v.filter(x=>x<90).length,
           lt30:v.filter(x=>x<30).length, zero:v.filter(x=>x<0.5).length };  // displayed 0 (rounds to 0)
}
function hist(vals,nbins=NBINS){
  const c=new Array(nbins).fill(0), w=100/nbins;
  for(const x of vals){ if(x===null) continue; let b=Math.floor(x/w); if(b>=nbins)b=nbins-1; if(b<0)b=0; c[b]++; }
  return c;
}

function render(){
  document.getElementById("app").innerHTML = `
    <h1>Content Trust Score — scoring model</h1>
    <p class="subtitle">Run <b>${DATA.meta.run}</b> · ${FMT(DATA.meta.n_modules)} modules · ${FMT(DATA.meta.n_claims)} claims
      (${FMT(DATA.meta.n_major)} major, ${FMT(DATA.meta.n_minor)} minor). Re-scoring only — extraction and validation unchanged.</p>
    ${writeupHTML()}
    <div class="controls" id="controls"></div>
    <div class="eq" id="eq"></div>
    <div class="bands">${BANDS.map(b=>`<span class="band"><span class="sw" style="background:${b.c}"></span><span class="rg">${b.lo}–${b.hi}</span> ${b.label}</span>`).join("")}</div>
    <div class="cards" id="cards"></div>
    <div class="changed" id="changed"></div>
    <h2>Score distribution</h2>
    <div class="card">
      <p class="legend"><span class="swatch" style="background:#e11d48"></span><b>red outline</b> = production (claims + abs penalty)
        <span class="swatch" style="background:#2563eb;opacity:.55"></span><b>blue bars</b> = this model</p>
      <div id="histWrap"></div>
    </div>
    <h2>The same-score group</h2>
    <p class="subtitle" id="clusterSub"></p>
    <div class="card"><div id="beeswarm"></div></div>
    <h2>Featured documents</h2>
    <p class="subtitle">A handful across the failure modes — the same-score cluster, the worst documents, minor-heavy and clean modules. Click to expand the claims that drove each score.</p>
    <div id="featured"></div>
    <h2>All modules</h2>
    <p class="subtitle">Search any module. Scores update with the scale-by control above. Claim detail is bundled for featured and same-score modules.</p>
    <input class="search" id="search" placeholder="Search ${FMT(DATA.meta.n_modules)} modules by title…">
    <div id="tableWrap"></div>`;
  renderControls(); renderAll();
  document.getElementById("search").oninput = e => { STATE.page=0; renderTable(e.target.value.toLowerCase()); };
}
function renderAll(){ renderEq(); renderCards(); renderChanged(); renderHist(); renderCluster(); renderFeatured(); renderTable(document.getElementById("search")?.value.toLowerCase()||""); }

function renderChanged(){
  const rows=DATA.docs.map(d=>[baseScore(d),activeScore(d)]).filter(([p,a])=>p!==null&&a!==null);
  const n=rows.length;
  const pz=rows.filter(([p])=>p<0.5).length, az=rows.filter(([,a])=>a<0.5).length;
  const dl=rows.map(([p,a])=>a-p).sort((x,y)=>x-y);
  const changed=dl.filter(x=>Math.abs(x)>=0.5).length, moved5=dl.filter(x=>Math.abs(x)>=5).length;
  const up=dl.filter(x=>x>0.5).length, down=dl.filter(x=>x<-0.5).length;
  const mean=dl.reduce((s,x)=>s+x,0)/n, med=dl[Math.floor(n/2)];
  const bdefs=[["≤−20",x=>x<=-20],["−20…−5",x=>x>-20&&x<=-5],["−5…−1",x=>x>-5&&x<=-1],["−1…+1",x=>x>-1&&x<1],["+1…+5",x=>x>=1&&x<5],["+5…+20",x=>x>=5&&x<20],["≥+20",x=>x>=20]];
  const counts=bdefs.map(([,f])=>dl.filter(f).length), maxc=Math.max(...counts,1);
  const W=760,H=92,base=72,maxh=40,bw=W/counts.length; let bars="";
  counts.forEach((c,i)=>{ const h=maxh*c/maxc, col=i<3?"#b91c1c":(i===3?"#9ca3af":"#15803d");
    bars+=`<rect x="${(i*bw+8).toFixed(1)}" y="${(base-h).toFixed(1)}" width="${(bw-16).toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" fill-opacity="0.55"/>`
        + `<text x="${(i*bw+bw/2).toFixed(1)}" y="${(base-h-3).toFixed(1)}" font-size="9.5" fill="#666" text-anchor="middle">${c}</text>`
        + `<text x="${(i*bw+bw/2).toFixed(1)}" y="86" font-size="9.5" fill="#999" text-anchor="middle">${bdefs[i][0]}</text>`; });
  document.getElementById("changed").innerHTML=`
    <div class="hd">What changed vs production</div>
    <div class="chgrow">
      <div class="chstat"><span class="k">modules scored 0</span><span class="v">${pz} → ${az}</span></div>
      <div class="chstat"><span class="k">scores changed</span><span class="v">${PCT0(changed/n)} <small>(${PCT0(moved5/n)} by ≥5 pts)</small></span></div>
      <div class="chstat"><span class="k">average change</span><span class="v">${SGN(mean)} <small>(median ${SGN(med)})</small></span></div>
      <div class="chstat"><span class="k">direction</span><span class="v"><span class="up">${PCT0(up/n)} ↑</span> &nbsp;<span class="down">${PCT0(down/n)} ↓</span></span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="max-width:780px"><text x="8" y="12" font-size="9.5" fill="#999">distribution of change (this model − production), in points</text>${bars}</svg>`;
}

function writeupHTML(){
  return `
  <details class="writeup" open>
    <summary>What the trust score measures</summary>
    <p>The trust score rates each module from 0 to 100 by its error density — how many severity-weighted issues it carries per 1,000 words of content. A module with no flagged issues scores 100, and the score falls as error density rises. Major issues count fully; minor issues count 0.3. The exact formula is below.</p>
    <p>Normalizing by content rather than by claim count makes modules of different lengths comparable. A long module with many major issues scores low; a long module with few stays high — length neither rescues a major-heavy module nor flattens the difference between them. At 30 points per weighted issue per 1,000 words, a really-bad module (about one major issue every 500 words) scores 40, while a typical module stays in the 90s. A soft floor keeps merely-bad modules from collapsing onto 0 — only the most error-dense modules (roughly one issue per 175 words or worse) reach 0.</p>
    <p>Production — the red reference throughout this page — instead divides by claim count and adds an absolute <span class="mono">ln(major)</span> penalty. That penalty does not depend on length, so it pins every single-major module near 81 regardless of size and forces many-major modules to 0. This model removes it.</p>
  </details>`;
}

function renderControls(){
  document.getElementById("controls").innerHTML = `
    <div class="ctl-group"><span class="ctl-label">Scale by</span>
      <div class="seg" id="segScale">
        <button data-s="words" class="${STATE.scaleBy==='words'?'on':''}">Words</button>
        <button data-s="chars" class="${STATE.scaleBy==='chars'?'on':''}">Characters</button></div></div>`;
  document.querySelectorAll("#segScale button").forEach(b=> b.onclick=()=>{ STATE.scaleBy=b.dataset.s;
    document.querySelectorAll("#segScale button").forEach(x=>x.classList.toggle("on",x.dataset.s===STATE.scaleBy)); renderAll(); });
}

function renderEq(){
  const unit = STATE.scaleBy==="chars" ? "characters" : "words";
  const coef = coefOf(STATE.scaleBy);
  const a = stats(DATA.docs.map(activeScore));
  const reallyBad = Math.max(0, 100 - 2*RATE);                 // reference "really bad" score (40)
  const perIssue = Math.round(coef*1000/(100-reallyBad));      // content per issue at that score: 500 words / 3,650 chars
  const zeros = DATA.docs.map(activeScore).filter(s=>s!==null && s<0.5).length;
  document.getElementById("eq").innerHTML = `
    <div class="row">errors per 1,000 ${unit} &nbsp;=&nbsp; ( 1.0 × major &nbsp;+&nbsp; 0.3 × minor ) &nbsp;÷&nbsp; ${unit} &nbsp;×&nbsp; 1,000</div>
    <div class="row">raw &nbsp;=&nbsp; 100 &nbsp;−&nbsp; <b>${coef}</b> × errors per 1,000 ${unit}</div>
    <div class="row">trust score &nbsp;=&nbsp; raw, &nbsp; or &nbsp; 25 × e<sup>(raw − 25) / 25</sup> &nbsp; when raw &lt; 25 &nbsp;&nbsp;<span style="color:#888">← soft floor</span></div>
    <div class="cons">clean module → <b>100</b> &nbsp;·&nbsp; really-bad (≈1 major / ${FMT(perIssue)} ${unit}) → <b>${reallyBad}</b> &nbsp;·&nbsp; corpus median → <b>${a.median.toFixed(0)}</b> &nbsp;·&nbsp; only the <b>${zeros}</b> most error-dense modules reach 0</div>`;
}

function renderCards(){
  const a=stats(DATA.docs.map(activeScore)), b=stats(DATA.docs.map(baseScore));
  const delta=(av,bv,lowerBetter,fmt)=>{ const d=av-bv, good=lowerBetter?d<0:d>0, cls=Math.abs(d)<1e-9?"flat":(good?"up":"down");
    return `<div class="d ${cls}">${fmt(d)} vs production</div>`; };
  document.getElementById("cards").innerHTML = `
    <div class="metric"><div class="k">Mean score</div><div class="v">${a.mean.toFixed(1)}</div><div class="b">production ${b.mean.toFixed(1)}</div>${delta(a.mean,b.mean,false,d=>(d>=0?'+':'')+d.toFixed(1))}</div>
    <div class="metric"><div class="k">Median</div><div class="v">${a.median.toFixed(1)}</div><div class="b">production ${b.median.toFixed(1)}</div>${delta(a.median,b.median,false,d=>(d>=0?'+':'')+d.toFixed(1))}</div>
    <div class="metric"><div class="k">≥ 90 (low density)</div><div class="v">${PCT(a.ge90/a.n)}</div><div class="b">flagged &lt;90: ${PCT(a.flag/a.n)} · ${FMT(a.flag)}</div>${delta(a.ge90/a.n,b.ge90/b.n,false,d=>PP(d))}</div>
    <div class="metric"><div class="k">Really bad (&lt; 30)</div><div class="v">${FMT(a.lt30)}</div><div class="b">at zero: ${FMT(a.zero)} · prod &lt;30: ${FMT(b.lt30)}</div>${delta(a.lt30,b.lt30,false,d=>(d>=0?'+':'')+FMT(Math.round(d)))}</div>`;
}

function renderHist(){
  const W=1040,H=240,pad=34,nb=NBINS;
  const base=hist(DATA.docs.map(baseScore)), act=hist(DATA.docs.map(activeScore));
  const maxc=Math.max(...base,...act,1);
  const pw=W-2*pad, ph=H-2*pad, bw=pw/nb, x=i=>pad+i*bw, y=c=>pad+ph*(1-c/maxc);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  s+=`<line x1="${pad}" y1="${pad+ph}" x2="${pad+pw}" y2="${pad+ph}" stroke="#ccc"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${pad+ph}" stroke="#ccc"/>`;
  act.forEach((c,i)=>{ if(c>0) s+=`<rect x="${(x(i)+0.5).toFixed(1)}" y="${y(c).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${(pad+ph-y(c)).toFixed(1)}" fill="#2563eb" fill-opacity="0.55"/>`; });
  let pts=[]; base.forEach((c,i)=>{ pts.push(`${x(i).toFixed(1)},${y(c).toFixed(1)}`,`${x(i+1).toFixed(1)},${y(c).toFixed(1)}`); });
  s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="#e11d48" stroke-width="1.6"/>`;
  [0,30,50,80,90,100].forEach(t=>{ const xx=pad+pw*t/100; s+=`<line x1="${xx}" y1="${pad}" x2="${xx}" y2="${pad+ph}" stroke="#f3f3f3"/><text x="${xx}" y="${H-10}" font-size="11" fill="#777" text-anchor="middle">${t}</text>`; });
  s+=`<text x="${pad}" y="${pad-12}" font-size="11" fill="#999">modules (max ${maxc})</text></svg>`;
  document.getElementById("histWrap").innerHTML=s;
}

function renderCluster(){
  const ids=DATA.cluster81;
  const span=ids.length?`${FMT(BYID[ids[0]].chars)}–${FMT(BYID[ids[ids.length-1]].chars)} chars`:"";
  const ratio=ids.length?Math.round(BYID[ids[ids.length-1]].chars/BYID[ids[0]].chars):0;
  const pv=ids.map(i=>baseScore(BYID[i])), av=ids.map(i=>activeScore(BYID[i]));
  const pmin=Math.min(...pv),pmax=Math.max(...pv),amin=Math.min(...av),amax=Math.max(...av);
  document.getElementById("clusterSub").innerHTML =
    `These <b>${ids.length}</b> modules were one of Jesus's main complaints: production scores them <b>${pmin.toFixed(1)}–${pmax.toFixed(1)}</b> — a ${(pmax-pmin).toFixed(1)}-point band — even though their content spans ${span} (a ${ratio}× range) and each has just a single major issue. This model spreads them to <b>${amin.toFixed(0)}–${amax.toFixed(0)}</b> (${(amax-amin).toFixed(0)} points), ordered by length: the more content a single issue sits in, the less it weighs. Top lane = production; bottom lane = this model.`;
  const W=1040,H=210,pad=40,axW=W-2*pad,X=v=>pad+axW*v/100,laneA=64,laneB=150;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  s+=`<line x1="${pad}" y1="${H-22}" x2="${pad+axW}" y2="${H-22}" stroke="#ddd"/>`;
  [0,20,40,60,80,100].forEach(t=>{ s+=`<line x1="${X(t)}" y1="40" x2="${X(t)}" y2="${H-22}" stroke="#f0f0f0"/><text x="${X(t)}" y="${H-8}" font-size="10" fill="#999" text-anchor="middle">${t}</text>`; });
  s+=`<text x="${pad}" y="${laneA-26}" class="lane-label">Production (claims + abs)</text>`;
  s+=`<text x="${pad}" y="${laneB-26}" class="lane-label">This model: ${STATE.scaleBy}, ${coefOf(STATE.scaleBy)} pts per issue / 1,000 ${STATE.scaleBy}</text>`;
  ids.forEach((id,i)=>{ const d=BYID[id], off=((i%7)-3)*5, xb=X(baseScore(d));
    s+=`<circle class="dot" data-id="${id}" cx="${xb.toFixed(1)}" cy="${laneA+off}" r="4.5" fill="#e11d48" fill-opacity="0.75"/>`;
    s+=`<circle class="dot act" data-id="${id}" cx="${xb.toFixed(1)}" cy="${laneB+off}" r="4.5" fill="#2563eb" fill-opacity="0.7"/>`; });
  s+=`</svg>`;
  document.getElementById("beeswarm").innerHTML=s;
  document.querySelectorAll("#beeswarm .dot").forEach(c=>{
    c.onmousemove=ev=>{ const d=BYID[c.dataset.id]; showTip(ev,`${esc(d.title||d.id)}<br>${FMT(d.chars)} chars · ${d.claims} claims · ${d.major} major / ${d.minor} minor<br>production ${baseScore(d).toFixed(1)} → this model ${(activeScore(d)??0).toFixed(1)}`); };
    c.onmouseleave=hideTip; });
  requestAnimationFrame(()=> document.querySelectorAll("#beeswarm .dot.act").forEach(c=> c.setAttribute("cx", X(activeScore(BYID[c.dataset.id])??0).toFixed(1))));
}

function scoreChips(d){
  const cfg=[{label:"production",base:true},{label:"words",sb:"words"},{label:"characters",sb:"chars"}];
  return cfg.map(c=>{
    const v = c.base ? baseScore(d) : contentScore(d, c.sb);
    const isActive = !c.base && c.sb===STATE.scaleBy;
    return `<span class="chip ${c.base?"bk":(isActive?"ak":"")}"><span class="cl">${c.label}</span> ${v===null?'—':v.toFixed(1)}</span>`;
  }).join("");
}
function claimsHTML(id){
  const cl=DATA.claims[id]; if(!cl) return `<p class="reason">Claim detail not bundled for this module.</p>`;
  const sevcls=s=>s==="major"?"sev-major":(s==="minor"?"sev-minor":"sev-none");
  const issues=cl.filter(c=>c.severity), list=(issues.length?issues:cl).slice(0,40);
  return `<p class="reason" style="margin-top:10px"><b>${cl.length}</b> claims · showing ${issues.length?issues.length+" with issues":"all"}</p>`+
    list.map(c=>`<div class="claim"><div class="cmeta ${sevcls(c.severity)}">${esc(c.rating)}${c.severity?` · ${esc(c.severity)}`:""}</div>
      <div>${esc(c.claim)}</div>${c.excerpt?`<div class="excerpt">${esc(c.excerpt)}</div>`:""}${c.reasoning?`<div class="reason">${esc(c.reasoning)}</div>`:""}</div>`).join("");
}
function renderFeatured(){
  document.getElementById("featured").innerHTML = DATA.featured.map(id=>{
    const d=BYID[id], b=baseScore(d), a=activeScore(d);
    return `<div class="fcard" data-id="${id}"><div class="fhead">
        <span class="ftitle">${esc(d.title||d.id)}</span>
        <span class="ftag">${FMT(d.chars)} chars · ${FMT(d.words)} words · ${d.major}maj/${d.minor}min</span>
        <span class="fscore">prod <b>${b===null?'—':b.toFixed(0)}</b> → <span class="dot-band" style="background:${bandOf(a)?.c||'#ccc'}"></span><b style="color:#1a56db">${a===null?'—':a.toFixed(0)}</b></span>
      </div><div class="fbody">
        ${a===null?'':`<div style="font-size:0.83rem;color:${bandOf(a).c};font-weight:600;margin-top:10px">${a.toFixed(0)} — ${bandOf(a).label}</div>`}
        <div class="varbar">${scoreChips(d)}</div>
        ${d.url?`<p class="reason"><a href="${d.url}" target="_blank" rel="noopener">open module ↗</a></p>`:""}
        <div class="claimwrap"></div></div></div>`;
  }).join("");
  document.querySelectorAll("#featured .fcard").forEach(card=>{
    card.querySelector(".fhead").onclick=()=>{ card.classList.toggle("open");
      const w=card.querySelector(".claimwrap"); if(card.classList.contains("open") && !w.dataset.loaded){ w.innerHTML=claimsHTML(card.dataset.id); w.dataset.loaded="1"; } };
  });
}

function sortVal(d,col){
  if(col==="title") return (d.title||d.id).toLowerCase();
  if(col==="words") return d.words;
  if(col==="claims") return d.claims;
  if(col==="majmin") return d.major*10000 + d.minor;
  if(col==="prod"){ const v=baseScore(d); return v===null?-1:v; }
  if(col==="active"){ const v=activeScore(d); return v===null?-1:v; }
  if(col==="delta"){ const a=activeScore(d), b=baseScore(d); return (a!==null&&b!==null)?a-b:-1e9; }
  return 0;
}
function renderTable(qraw){
  const q=(qraw||"").trim();
  let rows=DATA.docs; if(q) rows=rows.filter(d=>(d.title||"").toLowerCase().includes(q));
  const col=STATE.sortCol, dir=STATE.sortDir, sgn=dir==="asc"?1:-1;
  rows=rows.slice().sort((x,y)=>{ const vx=sortVal(x,col), vy=sortVal(y,col); return (vx<vy?-1:vx>vy?1:0)*sgn; });
  const total=rows.length, pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  STATE.page=Math.min(Math.max(0,STATE.page),pages-1);
  const start=STATE.page*PAGE_SIZE, shown=rows.slice(start,start+PAGE_SIZE);
  const arrow=c=> col===c?`<span class="arrow">${dir==="asc"?"▲":"▼"}</span>`:"";
  const th=(c,label)=>`<th class="sortable" data-col="${c}">${label}${arrow(c)}</th>`;
  let h=`<table class="tbl"><thead><tr>${th("title","module")}${th("words","words")}${th("claims","claims")}${th("majmin","maj/min")}${th("prod","production")}${th("active","this model")}${th("delta","Δ")}</tr></thead><tbody>`;
  for(const d of shown){ const b=baseScore(d), a=activeScore(d), dl=(a!==null&&b!==null)?a-b:null;
    const dcls=dl===null?"":(Math.abs(dl)<0.05?"flat":(dl>0?"up":"down")), hasC=!!DATA.claims[d.id];
    h+=`<tr class="detail" data-id="${d.id}"><td>${esc((d.title||d.id).slice(0,70))}${hasC?' <span class="ftag">claims</span>':''}</td>
      <td class="tnum">${FMT(d.words)}</td><td class="tnum">${d.claims}</td><td class="tnum">${d.major}/${d.minor}</td>
      <td class="tnum">${b===null?'—':b.toFixed(1)}</td><td class="tnum">${a===null?'—':`<span class="dot-band" style="background:${bandOf(a).c}"></span>${a.toFixed(1)}`}</td>
      <td class="tnum ${dcls}">${dl===null?'—':(dl>=0?'+':'')+dl.toFixed(1)}</td></tr>`; }
  h+=`</tbody></table>`;
  h+=`<div class="pager">
      <button data-pg="first" ${STATE.page===0?"disabled":""}>« First</button>
      <button data-pg="prev" ${STATE.page===0?"disabled":""}>‹ Prev</button>
      <span>${total?FMT(start+1):0}–${FMT(Math.min(start+PAGE_SIZE,total))} of ${FMT(total)}</span>
      <button data-pg="next" ${STATE.page>=pages-1?"disabled":""}>Next ›</button>
      <button data-pg="last" ${STATE.page>=pages-1?"disabled":""}>Last »</button></div>`;
  document.getElementById("tableWrap").innerHTML=h;
  document.querySelectorAll("#tableWrap th.sortable").forEach(thEl=> thEl.onclick=()=>{
    const c=thEl.dataset.col;
    if(STATE.sortCol===c) STATE.sortDir = STATE.sortDir==="asc"?"desc":"asc";
    else { STATE.sortCol=c; STATE.sortDir = c==="title"?"asc":"desc"; }
    STATE.page=0; renderTable(q);
  });
  document.querySelectorAll("#tableWrap .pager button").forEach(b=> b.onclick=()=>{
    const a=b.dataset.pg; STATE.page = a==="first"?0 : a==="prev"?STATE.page-1 : a==="next"?STATE.page+1 : pages-1;
    renderTable(q);
  });
  document.querySelectorAll("#tableWrap tr.detail").forEach(tr=>{ tr.onclick=()=>{ if(!DATA.claims[tr.dataset.id]) return;
    const ex=tr.nextElementSibling; if(ex&&ex.classList.contains("expand")){ ex.remove(); return; }
    const td=document.createElement("tr"); td.className="expand"; td.innerHTML=`<td colspan="7" style="background:#f9fafb">${claimsHTML(tr.dataset.id)}</td>`; tr.after(td); }; });
}

const tip=document.getElementById("tip");
function showTip(ev,html){ tip.innerHTML=html; tip.style.opacity=1; tip.style.left=Math.min(ev.clientX+12,window.innerWidth-310)+"px"; tip.style.top=(ev.clientY+12)+"px"; }
function hideTip(){ tip.style.opacity=0; }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function loadData(){
  // Self-contained builds embed the data in a <script id="scoring-data"> island;
  // the served site fetches it instead.
  const inline=document.getElementById("scoring-data");
  if(inline) return JSON.parse(inline.textContent);
  const r=await fetch("explorer_data/candidates.json"); if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function init(){
  try{
    DATA=await loadData(); BYID=Object.fromEntries(DATA.docs.map(d=>[d.id,d]));
    KCAL={ chars:DATA.calibration.chars, words:DATA.calibration.words };
    CHARS_COEF = Math.round(RATE * KCAL.chars / KCAL.words);   // ~219: equivalent rate per 1,000 chars
    render();
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="error"><p>Could not load scoring data.</p><p class="reason">${esc(e.message)}</p><p class="reason">Open this page through a local server (<code>python3 -m http.server</code>) or use the self-contained build.</p></div>`;
  }
}
init();
</script>
